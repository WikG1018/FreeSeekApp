# iOS 侧构建：在没有 Mac 的情况下，用 GitHub Actions 的 macOS runner
# 生成 iOS 工程与「未签名」的 .xcarchive。要装到 iPhone 需要：
#   1. 一台 Mac + Xcode；
#   2. Apple 开发者账号（免费账号可真机自签 7 天；付费 $99/年可长期安装与分发）；
#   3. 用 Xcode 打开归档（或 clone 本仓库后 npx cap add ios 自行构建），选择你的团队签名后安装。
name: iOS archive (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            archive

      - name: Zip iOS project and archive
        run: |
          cp -R build/App.xcarchive ios-archive
          zip -rq freeseek-ios.zip ios ios-archive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freeseek-ios-unsigned
          path: freeseek-ios.zip
