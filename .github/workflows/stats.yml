name: Release stats

# 每天 01:10 UTC（北京时间 09:10）采集一次发行数据，提交回仓库。
# 零后端：只读 GitHub 公开 API。
on:
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * *'

permissions:
  contents: write

concurrency:
  group: release-stats
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_REPO: ${{ github.repository }}
        run: node scripts/collect-stats.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(stats): $(date -u +%F) 发行数据"
            git push
          fi
