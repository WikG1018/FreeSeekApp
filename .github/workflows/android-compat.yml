name: Android 10-17 compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm test:compat && pnpm exec cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  device:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { api: 29, image: '29', tag: google_apis }
          - { api: 30, image: '30', tag: google_apis }
          - { api: 31, image: '31', tag: google_apis }
          - { api: 33, image: '33', tag: google_apis }
          - { api: 34, image: '34', tag: google_apis }
          - { api: 35, image: '35', tag: google_apis }
          - { api: 36, image: '36', tag: google_apis }
          - { api: 37, image: '37.0', tag: google_apis_ps16k }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-apks
          path: apks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run system image
        env:
          IMAGE: system-images;android-${{ matrix.image }};${{ matrix.tag }};x86_64
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | sdkmanager "$IMAGE" emulator > sdk-install.log 2>&1
          echo no | avdmanager create avd -n freeseek-test -k "$IMAGE" --path "$ANDROID_AVD_HOME/freeseek-test.avd" --force
          test -s "$ANDROID_AVD_HOME/freeseek-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd freeseek-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          for i in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb install -r apks/debug/app-debug.apk
          adb install -r apks/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e class app.freeseek.chat.AndroidCompatibilityTest app.freeseek.chat.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
          grep -q 'OK (1 test)' instrumentation.txt
          adb shell dumpsys webviewupdate > webview.txt
          adb shell getconf PAGESIZE > page-size.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-results
          path: |
            instrumentation.txt
            webview.txt
            page-size.txt
            emulator.log
            sdk-install.log
